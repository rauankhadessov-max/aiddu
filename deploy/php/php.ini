; Анализ выполняется синхронно: до 4 последовательных вызовов OpenAI
; по 180 с каждый (config/legal_analysis.php). Запас — 900 с.
max_execution_time = 900
max_input_time = 300
memory_limit = 512M

; Источники загружаются как DOCX, лимит валидации — 2 МБ (StoreSourceRequest)
upload_max_filesize = 16M
post_max_size = 16M

expose_php = Off
display_errors = Off
log_errors = On
error_log = /dev/stderr
date.timezone = Asia/Almaty

opcache.enable = 1
opcache.memory_consumption = 192
opcache.interned_strings_buffer = 16
opcache.max_accelerated_files = 20000
opcache.validate_timestamps = 0
opcache.jit = disable

realpath_cache_size = 4096k
realpath_cache_ttl = 600
