[www]
; Воркеры почти всё время ждут ответа OpenAI, а не грузят CPU,
; поэтому их держим больше числа ядер.
;
; Значение подобрано под сервер с 3.8 ГБ памяти: 8 воркеров по ~120 МБ
; в пике оставляют место PostgreSQL и Redis. При переносе на машину
; с 8 ГБ можно поднимать до 24.
;
; Практический смысл: столько анализов может идти одновременно.
pm = static
pm.max_children = 8
pm.max_requests = 500

; Должен превышать max_execution_time, иначе FPM убьёт долгий анализ
request_terminate_timeout = 960

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
