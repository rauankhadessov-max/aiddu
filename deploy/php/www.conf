[www]
; Воркеры почти всё время ждут ответа OpenAI, а не грузят CPU,
; поэтому их держим заметно больше числа ядер.
;
; 24 воркера по ~100 МБ в пике — около 2.4 ГБ, что оставляет место
; PostgreSQL, Redis и системе на сервере с 8 ГБ памяти.
;
; Практический смысл значения: столько анализов может идти одновременно.
pm = static
pm.max_children = 24
pm.max_requests = 500

; Должен превышать max_execution_time, иначе FPM убьёт долгий анализ
request_terminate_timeout = 960

catch_workers_output = yes
decorate_workers_output = no
clear_env = no

php_admin_value[error_log] = /dev/stderr
php_admin_flag[log_errors] = on
